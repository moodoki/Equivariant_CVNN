data:
  batch_size: 16
  dataset:
    name: S1SLC
    trainpath: $TMPDIR/data
  transform: LogAmplitude
  num_workers: 0
  valid_ratio: 0.15
  test_ratio: 0.15
logging:
  logdir: ./logs
loss:
  name: FocalLoss
  gamma: 3
model:
  activation: modReLU
  channels_ratio: 16
  class: ResNet
  res: true
  projection:
    class: MLPCtoR
    global: true
    softmax: Softmax
  downsampling: LPD_F
  upsampling: Null
  latent_dim: 128
  dropout: 0.1
  normalization:
    method: BatchNorm
    track_running_stats: false
  num_layers: 4
  gumbel_tau:
    start_value: 5
    gamma: 0.1
    start_decay_epoch: 5
    min_value: 0.00001
nepochs: 1
optim:
  algo: AdamW
  params:
    lr: 0.001
    weight_decay: 0.0005
scheduler:
  algo: StepLR
  params:
    step_size: 1000
    gamma: 1
pretrained: false
world_size: 1
dtype: complex64
