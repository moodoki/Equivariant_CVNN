# Task-specific configuration for TEL2 commercial reconstruction
task: reconstruction

mode: full
nepochs: 50
world_size: 1

data:
  recompute_statistics: true
  shuffle: true
  batch_size: 48
  dataset:
    name: Tel2Commrcial_v1
    trainpath: $TMPDIR/data
    patch_size: 64
    patch_stride: 64
    output_mode: three_channel
    scene_names:
      - MischiefReef_20240526
    product_names:
      - TEL2_SPOT_GRD_QP_20240526T034301_20240526T034303_05998_3_0000
    raw_scale_factor: percentile
    raw_scale_percentile: 99.5
  num_workers: 4
  test_ratio: 0.15
  valid_ratio: 0.15
  transforms:
    - name: logamplitude

model:
  activation: modReLU
  channels_width: 48
  class: AutoEncoder
  layer_mode: complex
  num_layers: 2
  num_blocks: 1
  normalization_layer: batch
  downsampling_layer: LPD
  upsampling_layer: LPU
  residual: true
  dropout: 0.0
  projection_layer: polynomial
  projection:
    order: 5
  gumbel_tau:
    start_value: 0.001
    gamma: 0.1
    start_decay_epoch: 5
    min_value: 0.000001

evaluation:
  check_invariance: true
  domain: spatial

logging:
  logdir: /data/equiv-cvnn/logs
  backend: aim
  aim:
    experiment: tel2commercial_mischiefreef_20240526_v2

loss:
  name: MSE

optim:
  algo: AdamW
  params:
    lr: 0.005
    weight_decay: 0.0005
    betas: [0.9, 0.999]
  max_norm: 0.01

scheduler:
  name: ReduceLROnPlateau
  params:
    mode: min
    factor: 0.99
    patience: 5
    min_lr: 0.00005

warmup:
  epochs: 0
