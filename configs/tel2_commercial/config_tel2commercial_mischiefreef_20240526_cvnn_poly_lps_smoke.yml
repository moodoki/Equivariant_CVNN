data:
  batch_size: 4
  dataset:
    name: Tel2Commrcial_v1
    trainpath: $TMPDIR/data
    output_mode: three_channel
    scene_names:
      - MischiefReef_20240526
    product_names:
      - TEL2_SPOT_GRD_QP_20240526T034301_20240526T034303_05998_3_0000
  transform: LogAmplitude
  img_size: 64
  img_stride: 64
  num_workers: 0
  valid_ratio: 0.15
  test_ratio: 0.15
logging:
  logdir: ./logs
  backend: aim
  aim:
    experiment: tel2commercial_mischiefreef_20240526
loss:
  name: ComplexMSELoss
model:
  activation: modReLU
  channels_ratio: 16
  class: AutoEncoderWD
  res: true
  projection:
    class: PolyCtoR
    global: true
  downsampling: LPD_F
  upsampling: LPU_F
  latent_dim: Null
  dropout: 0
  normalization:
    method: BatchNorm
    track_running_stats: false
  num_layers: 4
  gumbel_tau:
    start_value: 10
    gamma: 0.1
    start_decay_epoch: 10
    min_value: 0.00001
nepochs: 1
optim:
  algo: AdamW
  params:
    lr: 0.001
    weight_decay: 0
scheduler:
  algo: StepLR
  params:
    step_size: 10000
    gamma: 0.9
pretrained: false
world_size: 4
dtype: complex64
