# Task-specific configuration for Reconstruction task
task: reconstruction

data:
  recompute_statistics: true
  shuffle: true
  batch_size: 32
  dataset:
    name: ALOSDataset
    trainpath: $TMPDIR/data
    patch_size: 64
    patch_stride: 64
    crop_coordinates:
      start_col: 1000
      start_row: 3000
      end_col: 3200
      end_row: 7500
  num_workers: 4
  test_ratio: 0.1
  valid_ratio: 0.1
  transforms:
    - name: logamplitude

model:
  activation: modReLU
  channels_width: 64
  class: AutoEncoder
  layer_mode: complex
  num_layers: 2
  num_blocks: 1
  normalization_layer: batch
  downsampling_layer: LPD
  upsampling_layer: LPU
  residual: true
  dropout: 0.0
  projection_layer: polynomial
  projection:
    order: 5
  gumbel_tau:
    start_value: 0.001
    gamma: 0.1
    start_decay_epoch: 5
    min_value: 0.000001

evaluation:
  check_invariance: true
  domain: spatial

logging:
  logdir: /data/equiv-cvnn/logs
  backend: aim
  aim:
    experiment: sf_alos2_v2

loss:
  name: MSE
