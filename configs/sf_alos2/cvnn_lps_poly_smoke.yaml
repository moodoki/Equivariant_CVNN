# Task-specific configuration for Reconstruction task
task: reconstruction

mode: full
nepochs: 1
world_size: 1

data:
  recompute_statistics: false
  shuffle: true
  batch_size: 4
  dataset:
    name: ALOSDataset
    trainpath: $TMPDIR/data
    patch_size: 64
    patch_stride: 64
    crop_coordinates:
      end_col: 1512
      end_row: 3512
      start_col: 1000
      start_row: 3000
  num_workers: 0
  test_ratio: 0.15
  valid_ratio: 0.15
  min_real_value:
    - 2.1424446458695456e-05
    - 1.1317729331494775e-05
    - 5.429208613350056e-05
    - 5.739567131968215e-05
  max_real_value:
    - 108.35096740722656
    - 57.574771881103516
    - 56.268123626708984
    - 72.82919311523438
  transforms:
    - name: logamplitude

model:
  activation: modReLU
  channels_width: 48
  class: AutoEncoder
  layer_mode: complex
  num_layers: 2
  num_blocks: 1
  normalization_layer: batch
  downsampling_layer: LPD
  upsampling_layer: LPU
  residual: true
  dropout: 0.0
  projection_layer: polynomial
  projection:
    order: 5
  gumbel_tau:
    start_value: 0.001
    gamma: 0.1
    start_decay_epoch: 5
    min_value: 0.000001

evaluation:
  check_invariance: true
  domain: spatial

logging:
  logdir: ./logs
  backend: aim
  aim:
    experiment: sf_alos2_v2

loss:
  name: MSE

optim:
  algo: AdamW
  params:
    lr: 0.005
    weight_decay: 0.0005
    betas: [0.9, 0.999]
  max_norm: 0.01

scheduler:
  name: ReduceLROnPlateau
  params:
    mode: min
    factor: 0.99
    patience: 5
    min_lr: 0.00005

warmup:
  epochs: 0
